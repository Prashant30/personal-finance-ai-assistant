services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      FINANCE_DB_PATH: /app/runtime/finance.db
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-local-development-key}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-8B}
    volumes:
      - finance-data:/app/runtime

volumes:
  finance-data:

